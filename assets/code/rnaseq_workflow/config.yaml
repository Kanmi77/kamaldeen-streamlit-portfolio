threads: 4
strandedness: 2
metadata: config/sample_metadata.csv

reference:
  fasta: data/reference/genome.fa
  gtf: data/reference/annotation.gtf
  sjdb_overhang: 99
  genome_sa_index_nbases: 11

cutadapt:
  trim_front: 10
  minimum_length: 25
  quality: 30

samples:
  G1_rep1: {r1: data/fastq/G1_rep1_R1.fastq.gz, r2: data/fastq/G1_rep1_R2.fastq.gz}
  G1_rep2: {r1: data/fastq/G1_rep2_R1.fastq.gz, r2: data/fastq/G1_rep2_R2.fastq.gz}
  G1_rep3: {r1: data/fastq/G1_rep3_R1.fastq.gz, r2: data/fastq/G1_rep3_R2.fastq.gz}
  G2_rep1: {r1: data/fastq/G2_rep1_R1.fastq.gz, r2: data/fastq/G2_rep1_R2.fastq.gz}
  G2_rep2: {r1: data/fastq/G2_rep2_R1.fastq.gz, r2: data/fastq/G2_rep2_R2.fastq.gz}
  G2_rep3: {r1: data/fastq/G2_rep3_R1.fastq.gz, r2: data/fastq/G2_rep3_R2.fastq.gz}

results:
  featurecounts: results/counts/featureCounts.txt
  deseq2_table: results/deseq2/deseq2_results.csv
  ma_plot: results/deseq2/ma_plot.png
